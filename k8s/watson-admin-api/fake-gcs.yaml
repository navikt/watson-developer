apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-gcs
  template:
    metadata:
      labels:
        app: fake-gcs
    spec:
      containers:
        - name: fake-gcs
          image: fsouza/fake-gcs-server:1.52.2
          args: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-backend", "memory"]
          ports:
            - containerPort: 4443
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs
spec:
  selector:
    app: fake-gcs
  ports:
    - port: 4443
      targetPort: 4443
